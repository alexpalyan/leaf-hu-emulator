name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config glib pixman gnutls capstone libslirp \
              libssh libusb zstd libpng snappy lzo
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential ninja-build pkg-config python3 python3-venv \
              libglib2.0-dev libpixman-1-dev libgnutls28-dev libcapstone-dev \
              libslirp-dev libssh-dev libusb-1.0-0-dev libzstd-dev libpng-dev \
              libsnappy-dev liblzo2-dev libsdl2-dev flex bison patchelf
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-utils

      - name: Configure
        run: |
          mkdir build-pkg
          cd build-pkg
          # macOS uses the Cocoa UI; SDL would drag in an unbundleable SDL3.
          extra=
          [ "$RUNNER_OS" = macOS ] && extra=--disable-sdl
          ../configure --target-list=arm-softmmu,sh4-softmmu \
              --disable-werror --enable-plugins --disable-docs $extra

      - name: Build
        run: ninja -C build-pkg qemu-system-arm qemu-system-sh4 qemu-img qemu-clarion contrib-plugins

      - name: Package
        id: pkg
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=dev-$(git rev-parse --short HEAD)
          fi
          archive=$(scripts/clarion/package.sh -b build-pkg -o dist "$tag")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          mkdir smoke
          tar -C smoke -xzf "${{ steps.pkg.outputs.archive }}"
          cd smoke/qemu-clarion-*
          test -f share/applications/leaf-hu-emulator.desktop
          grep -Fx 'Name=Leaf HU Emulator' share/applications/leaf-hu-emulator.desktop
          grep -Fx 'Exec=qemu-clarion' share/applications/leaf-hu-emulator.desktop
          grep -Fx 'Icon=leaf-hu-emulator' share/applications/leaf-hu-emulator.desktop
          cmp "$GITHUB_WORKSPACE/ui/icons/leaf-hu-emulator_128x128.png" \
              share/icons/hicolor/128x128/apps/leaf-hu-emulator.png
          cmp "$GITHUB_WORKSPACE/ui/icons/leaf-hu-emulator_32x32.bmp" \
              share/icons/hicolor/32x32/apps/leaf-hu-emulator.bmp
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash -euc '
              libexec/qemu-system-arm -M none -display sdl -S \
                -name "MODEL: TEST - DSW: 7" > /tmp/leaf-hu-sdl.log 2>&1 &
              qemu_pid=$!
              trap "kill $qemu_pid 2>/dev/null || true; wait $qemu_pid 2>/dev/null || true" EXIT
              window=
              for _ in $(seq 1 50); do
                window=$(xdotool search --onlyvisible \
                  --name "^Leaf HU Emulator MODEL: TEST - DSW: 7$" 2>/dev/null | head -n 1 || true)
                [ -n "$window" ] && break
                sleep 0.1
              done
              [ -n "$window" ]
              xprop -id "$window" WM_HINTS
            '
          fi
          # The launcher prints usage and exits non-zero without arguments.
          ./qemu-clarion 2>&1 | grep -i usage
          ./qemu-clarion --help 2>&1 | grep -- --identify
          libexec/qemu-img --version
          test -x qmp.py
          test -f lib/libclarion-dbgprint.so || \
              test -f lib/libclarion-dbgprint.dylib
          libexec/qemu-system-arm -M help | grep clarion
          libexec/qemu-system-sh4 -M help | grep clarion
          # No shared library may be resolved outside the archive.
          if [ "$RUNNER_OS" = macOS ]; then
            if otool -L qemu-clarion libexec/* lib/* | grep -E '/opt/homebrew|/usr/local'; then
              exit 1
            fi
          else
            leak=0
            for f in qemu-clarion libexec/* lib/libclarion-dbgprint.so; do
              if ldd "$f" | grep -v "$PWD" | grep '=> /' |
                  grep -vE 'lib(c|m|dl|pthread|rt|util|resolv)\.so'; then
                echo "^ resolved outside the package: $f"
                leak=1
              fi
            done
            [ $leak = 0 ]
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-package
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
